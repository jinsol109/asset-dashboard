<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>대시보드 선택</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111a2b;--line:#263550;--text:#ecf2ff;--muted:#91a0ba;--blue:#7aa2ff;--cyan:#5bd6e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#17253f 0,#0b1220 48%,#070d18 100%);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif}
main{width:min(980px,100%);margin:0 auto;padding:clamp(48px,12vh,120px) 24px 64px}
.eyebrow{margin:0 0 18px;text-align:center;color:var(--blue);font-size:14px;font-weight:750;letter-spacing:.14em}
h1{margin:0;text-align:center;font-size:clamp(30px,5vw,44px);letter-spacing:-.045em}
.intro{margin:18px auto 42px;text-align:center;color:var(--muted);font-size:16px;line-height:1.7}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{display:flex;min-height:285px;flex-direction:column;align-items:flex-start;padding:30px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#141e31,#0f1726);color:inherit;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 18px 42px #0004;outline:none}
.icon{font-size:38px;line-height:1}
.card h2{margin:32px 0 10px;font-size:27px;letter-spacing:-.04em}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
.link{margin-top:auto;padding-top:28px;color:var(--blue);font-size:16px;font-weight:750}
.card.stock .link{color:var(--cyan)}
@media(max-width:680px){main{padding:72px 20px 48px}.intro{margin-bottom:30px;font-size:14px}.cards{grid-template-columns:1fr;gap:14px}.card{min-height:250px;padding:26px;border-radius:26px}.card h2{margin-top:28px;font-size:25px}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">PERSONAL DASHBOARDS</p>
  <h1>대시보드를 선택하세요</h1>
  <p class="intro">보고 싶은 화면을 선택하면 해당 대시보드가 전체 화면으로 열립니다.</p>
  <section class="cards" aria-label="대시보드 목록">
    <a class="card" href="family-dashboard.html">
      <span class="icon" aria-hidden="true">🏠</span>
      <h2>가족 자산 대시보드</h2>
      <p>월별 총자산, 증감액, 증가율과 가족 자산 기록을 확인합니다.</p>
      <span class="link">가족 자산 보기 →</span>
    </a>
    <a class="card stock" href="stock.html">
      <span class="icon" aria-hidden="true">📈</span>
      <h2>주식 자산 대시보드</h2>
      <p>주식 평가금액, 계좌별 구성, 수익률과 월별 흐름을 확인합니다.</p>
      <span class="link">주식 자산 보기 →</span>
    </a>
  </section>
</main>
</body>
</html>
