<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식 자산 대시보드</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--text:#ecf2ff;--muted:#91a0ba;--line:#263550;--blue:#7aa2ff;--cyan:#5bd6e8;--green:#59d29a;--red:#ff7b88}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top left,#17253f 0,#0b1220 42%,#070d18 100%);color:var(--text);min-height:100vh}
.wrap{max-width:1440px;margin:auto;padding:28px}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
h1{margin:0;font-size:30px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin-top:8px}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:#b9c6dc;background:#10192a;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}.card,.panel{background:linear-gradient(180deg,rgba(22,34,56,.96),rgba(15,24,40,.96));border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.18)}
.card{border-radius:18px;padding:18px}.label{font-size:12px;color:var(--muted);margin-bottom:9px}.value{font-size:24px;font-weight:750;letter-spacing:-.035em}.pos{color:var(--green)}.neg{color:var(--red)}
.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:16px;margin-bottom:16px}.panel{border-radius:20px;padding:20px}.panel h2{font-size:15px;margin:0 0 16px}.chartbox{height:315px;position:relative}
svg{width:100%;height:100%;overflow:visible}.axis{font-size:10px;fill:#7788a4}.gridline{stroke:#24334d;stroke-width:1}.bar{fill:var(--cyan);opacity:.82}
.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:6px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:18px;min-height:290px}.donut{width:170px;height:170px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:30px;border-radius:50%;background:#111a2b;border:1px solid #23324b}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-size:11px;color:var(--muted)}.donut-center b{font-size:17px;color:var(--text);margin-top:4px}
.alloc{display:grid;gap:12px}.alloc-row{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12px}.alloc-name{display:flex;align-items:center;gap:8px}.swatch{width:8px;height:8px;border-radius:50%}
.track{grid-column:1/3;height:5px;background:#1f2c43;border-radius:999px;overflow:hidden}.track span{display:block;height:100%;border-radius:999px}
.table-panel{margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--muted);font-weight:600;text-align:right;padding:11px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}td{padding:13px 10px;border-bottom:1px solid #1f2b41;text-align:right}tr:last-child td{border-bottom:0}.footer{font-size:11px;color:#71819c;text-align:right;padding:4px 2px 20px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:620px){.wrap{padding:16px}.kpis{grid-template-columns:1fr}.header{align-items:start;flex-direction:column}.donut-wrap{grid-template-columns:1fr}.chartbox{height:270px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div><h1>주식 자산 대시보드</h1><div class="sub">Excel 자산정리 데이터를 기반으로 만든 웹 대시보드</div></div><div class="badge">최근 데이터 · 2026-08</div></div>
  <section class="kpis">
    <div class="card"><div class="label">총 평가금액</div><div class="value">387,482,600원</div></div>
    <div class="card"><div class="label">투자원금</div><div class="value">326,616,890원</div></div>
    <div class="card"><div class="label">평가손익</div><div class="value pos">+60,865,710원</div></div>
    <div class="card"><div class="label">수익률</div><div class="value pos">+18.6%</div></div>
    <div class="card"><div class="label">전월 대비 자산</div><div class="value pos">+9,192,794원</div></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>월별 총자산 추이</h2><div class="chartbox"><svg id="lineChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg></div><div class="legend"><span><i style="background:var(--blue)"></i>총 평가금액</span></div></div>
    <div class="panel"><h2>계좌별 자산 구성 · 2026-08</h2><div class="donut-wrap"><div class="donut" id="donut"><div class="donut-center">합계<b id="donutTotal"></b></div></div><div class="alloc" id="alloc"></div></div></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>월별 평가손익</h2><div class="chartbox"><svg id="barChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg></div></div>
    <div class="panel"><h2>수익률 흐름</h2><div class="chartbox"><svg id="returnChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg></div></div>
  </section>
  <section class="panel table-panel"><h2>계좌별 현황 · 2026-08</h2><table><thead><tr><th>계좌</th><th>평가금액</th><th>원금</th><th>평가손익</th><th>수익률</th><th>비중</th></tr></thead><tbody id="accountTable"></tbody></table></section>
  <div class="footer">※ 원본 Excel에 최신 평가금액이 비어 있는 계좌는 최신 계좌 구성에서 제외했습니다.</div>
</div>
<script>
const months=["2025-12", "2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08"];
const totals=[273455678, 329041754, 406731944, 411651586, 464492340, 521652184, 474872552, 378289806, 387482600];
const profits=[56477839, 84270877, 97711962, 84841783, 105639460, 128908032, 105206866, 56592403, 60865710];
const returns=[26.029, 34.428, 31.62, 25.961, 29.438, 32.822, 28.46, 17.592, 18.635];
const accounts=[{"name": "키움증권", "value": 14583690, "principal": 6500000, "profit": 8083690, "return": 1.2436446153846155}, {"name": "NH증권", "value": 61751420, "principal": 50000000, "profit": 11751420, "return": 0.23502840000000003}, {"name": "한국투자증권", "value": 95772371, "principal": 100000000, "profit": -4227629, "return": -0.042276289999999994}, {"name": "삼성증권(개인연금)", "value": 103310308, "principal": 66251180, "profit": 37059128, "return": 0.5593731009772203}];
const colors=['#7aa2ff','#59d29a','#f6c85f','#ff8a65','#b18cff','#5bd6e8'];
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const short=n=>n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(0)+'만':fmt(n);

function lineChart(svgId,data,suffix,stroke,fillArea){
  const svg=document.getElementById(svgId),W=760,H=300,L=58,R=16,T=18,B=38;
  const min=Math.min(...data),max=Math.max(...data),pad=(max-min)*.15||max*.1,lo=Math.max(0,min-pad),hi=max+pad;
  const x=i=>L+i*(W-L-R)/(data.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='<defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+stroke+'" stop-opacity=".28"/><stop offset="100%" stop-color="'+stroke+'" stop-opacity=".02"/></linearGradient></defs>';
  for(let g=0;g<5;g++){const yy=T+g*(H-T-B)/4,val=hi-g*(hi-lo)/4;s+='<line class="gridline" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="axis" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+(suffix==='%'?val.toFixed(0)+'%':short(val))+'</text>';}
  const pts=data.map((v,i)=>[x(i),y(v)]);
  if(fillArea){const area='M '+pts[0][0]+' '+(H-B)+' '+pts.map(p=>'L '+p[0]+' '+p[1]).join(' ')+' L '+pts[pts.length-1][0]+' '+(H-B)+' Z';s+='<path d="'+area+'" fill="url(#areaGradient)"/>';}
  s+='<path d="M '+pts.map(p=>p.join(' ')).join(' L ')+'" fill="none" stroke="'+stroke+'" stroke-width="3"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#111a2b" stroke="'+stroke+'" stroke-width="2"/><text class="axis" x="'+p[0]+'" y="'+(H-14)+'" text-anchor="middle">'+months[i].slice(5)+'</text>';});
  svg.innerHTML=s;
}
function barChart(svgId,data){
  const svg=document.getElementById(svgId),W=760,H=300,L=58,R=16,T=18,B=38,hi=Math.max(...data)*1.15,xw=(W-L-R)/data.length,bw=xw*.58;let s='';
  for(let g=0;g<5;g++){const yy=T+g*(H-T-B)/4,val=hi-g*hi/4;s+='<line class="gridline" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="axis" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+short(val)+'</text>';}
  data.forEach((v,i)=>{const h=v/hi*(H-T-B),xx=L+i*xw+(xw-bw)/2,yy=H-B-h;s+='<rect x="'+xx+'" y="'+yy+'" width="'+bw+'" height="'+h+'" rx="5" class="bar"/><text class="axis" x="'+(xx+bw/2)+'" y="'+(H-14)+'" text-anchor="middle">'+months[i].slice(5)+'</text>';});
  svg.innerHTML=s;
}
lineChart('lineChart',totals,'','#7aa2ff',true);barChart('barChart',profits);lineChart('returnChart',returns,'%','#59d29a',false);
const accTotal=accounts.reduce((a,b)=>a+b.value,0);document.getElementById('donutTotal').textContent=short(accTotal);
let cur=0,stops=[];accounts.forEach((a,i)=>{const p=a.value/accTotal*100,c=colors[i%colors.length];stops.push(c+' '+cur+'% '+(cur+p)+'%');cur+=p;});document.getElementById('donut').style.background='conic-gradient('+stops.join(',')+')';
const alloc=document.getElementById('alloc');accounts.forEach((a,i)=>{const p=a.value/accTotal*100,c=colors[i%colors.length];alloc.insertAdjacentHTML('beforeend','<div class="alloc-row"><div class="alloc-name"><span class="swatch" style="background:'+c+'"></span>'+a.name+'</div><div>'+p.toFixed(1)+'%</div><div class="track"><span style="width:'+p+'%;background:'+c+'"></span></div></div>');});
const tbody=document.getElementById('accountTable');accounts.forEach(a=>{const p=a.value/accTotal*100,cls=a.profit>=0?'pos':'neg';tbody.insertAdjacentHTML('beforeend','<tr><td>'+a.name+'</td><td>'+fmt(a.value)+'원</td><td>'+fmt(a.principal)+'원</td><td class="'+cls+'">'+(a.profit>=0?'+':'')+fmt(a.profit)+'원</td><td class="'+cls+'">'+(a.return>=0?'+':'')+(a.return*100).toFixed(1)+'%</td><td>'+p.toFixed(1)+'%</td></tr>');});
</script></body></html>
