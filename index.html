<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대시보드 선택</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#263550;--text:#ecf2ff;--muted:#91a0ba;--blue:#7aa2ff;--cyan:#5bd6e8;--shadow:0 20px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#17253f 0,#0b1220 48%,#070d18 100%);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
.chooser{width:min(900px,100%);text-align:center}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em}.title{margin:12px 0 8px;font-size:clamp(28px,5vw,44px);letter-spacing:-.06em}.hint{margin:0 0 34px;color:var(--muted);font-size:14px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{display:block;text-decoration:none;color:var(--text);text-align:left;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel),#0f1828);box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s}.choice:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 24px 60px rgba(0,0,0,.4)}.choice.stock:hover{border-color:var(--cyan)}.icon{font-size:30px;margin-bottom:22px}.choice h2{margin:0 0 8px;font-size:22px;letter-spacing:-.04em}.choice p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.arrow{display:block;margin-top:24px;color:var(--blue);font-size:13px;font-weight:700}.stock .arrow{color:var(--cyan)}
@media(max-width:640px){body{padding:18px}.choices{grid-template-columns:1fr}.choice{padding:22px}.hint{margin-bottom:24px}}
</style>
</head>
<body><main class="chooser"><div class="eyebrow">PERSONAL DASHBOARDS</div><h1 class="title">대시보드를 선택하세요</h1><p class="hint">보고 싶은 화면을 선택하면 해당 대시보드가 전체 화면으로 열립니다.</p><section class="choices" aria-label="대시보드 선택"><a class="choice" href="family-dashboard.html"><div class="icon">🏠</div><h2>가족 자산 대시보드</h2><p>월별 총자산, 증감액, 증가율과 가족 자산 기록을 확인합니다.</p><span class="arrow">가족 자산 보기 →</span></a><a class="choice stock" href="stock.html"><div class="icon">📈</div><h2>주식 자산 대시보드</h2><p>주식 평가금액, 계좌별 구성, 수익률과 월별 흐름을 확인합니다.</p><span class="arrow">주식 자산 보기 →</span></a></section></main></body></html>
