<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자산 대시보드</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#172033;--muted:#718096;--line:#e6ebf3;--blue:#3978f6;--shadow:0 12px 32px #17203312}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.shell{max-width:1440px;margin:auto;padding:24px 20px 30px}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.title{margin:5px 0 0;font-size:30px;letter-spacing:-.05em}.hint{margin:4px 0 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);padding:6px;border-radius:14px;box-shadow:var(--shadow)}button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}button.active{background:var(--blue);color:#fff}main{height:calc(100vh - 154px);min-height:650px;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}iframe{display:none;width:100%;height:100%;border:0;background:var(--bg)}iframe.active{display:block}.status{position:fixed;bottom:10px;right:16px;color:var(--muted);font-size:11px}@media(max-width:640px){.header{display:block}.tabs{margin-top:16px;width:max-content}.title{font-size:25px}main{height:calc(100vh - 190px);min-height:580px}}
</style></head>
<body><div class="shell"><header class="header"><div><div class="eyebrow">PERSONAL WEALTH</div><h1 class="title">자산 대시보드</h1><p class="hint">원하는 대시보드를 선택해서 확인하세요.</p></div><nav class="tabs" aria-label="대시보드 선택"><button class="active" data-target="family">가족 자산</button><button data-target="stock">주식 대시보드</button></nav></header><main><iframe id="family" class="active" title="가족 자산 대시보드" src="family-dashboard.html"></iframe><iframe id="stock" title="주식 자산 대시보드" src="stock.html"></iframe></main></div><div class="status">대시보드 통합 화면</div>
<script>const buttons=[...document.querySelectorAll('button')],frames=[...document.querySelectorAll('iframe')];buttons.forEach(btn=>btn.addEventListener('click',()=>{buttons.forEach(x=>x.classList.toggle('active',x===btn));frames.forEach(x=>x.classList.toggle('active',x.id===btn.dataset.target));}));</script></body></html>
