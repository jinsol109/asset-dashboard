<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식 자산</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--panel2:#0f1828;--control-bg:#1c2536;--text:#ecf2ff;--muted:#91a0ba;--line:#263550;--blue:#7aa2ff;--cyan:#5bd6e8;--green:#59d29a;--red:#ff7b88;--grid:#24334d;--track:#1f2c43;--tableline:#1f2b41;--donut-hole:#111a2b}
:root.light{--bg:#f4f7fb;--panel:#ffffff;--panel2:#ffffff;--control-bg:#ffffff;--text:#172033;--muted:#718096;--line:#e8edf4;--blue:#3978f6;--cyan:#27b8ca;--green:#13a66a;--red:#e05252;--grid:#e8edf4;--track:#e8edf4;--tableline:#e8edf4;--donut-hole:#ffffff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:radial-gradient(circle at top left,#17253f 0,#0b1220 42%,#070d18 100%);transition:background .25s,color .25s;color:var(--text);min-height:100vh}:root.light body{background:var(--bg)}
.wrap{max-width:1240px;margin:auto;padding:34px 24px 60px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.dashboard-nav{display:flex;gap:6px}.dashboard-nav a{border:1px solid var(--line);background:var(--control-bg);color:var(--muted);padding:10px 11px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:700}.dashboard-nav a.active{background:var(--blue);border-color:var(--blue);color:#fff}
.eyebrow{font-size:13px;color:var(--blue);font-weight:700;letter-spacing:.08em}h1{margin:7px 0 4px;font-size:clamp(27px,4vw,40px);letter-spacing:-.04em}.sub{color:var(--muted);font-size:14px;margin:0}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--control-bg);font-size:12px}.theme-toggle{border:1px solid var(--line);background:var(--control-bg);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700}.theme-toggle:hover{transform:translateY(-1px)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:24px 0}.card,.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.10);transition:background .25s,border-color .25s}
.card{border-radius:18px;padding:18px}.label{font-size:12px;color:var(--muted);margin-bottom:9px}.value{font-size:24px;font-weight:750;letter-spacing:-.035em}.pos{color:var(--green)}.neg{color:var(--red)}
.light .card,.light .panel{border-radius:18px;box-shadow:0 12px 32px #17203312}
.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:14px;margin:24px 0}.panel{border-radius:18px;padding:22px}.panel h2{font-size:15px;margin:0 0 16px}.chartbox{height:315px;position:relative}
svg{width:100%;height:100%;overflow:visible}.axis{font-size:10px;fill:#7788a4}.gridline{stroke:var(--grid);stroke-width:1}.bar{fill:var(--cyan);opacity:.82}
.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:6px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:18px;min-height:290px}.donut{width:170px;height:170px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--donut-hole);border:1px solid var(--line)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-size:11px;color:var(--muted)}.donut-center b{font-size:17px;color:var(--text);margin-top:4px}
.alloc{display:grid;gap:12px}.alloc-row{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12px}.alloc-name{display:flex;align-items:center;gap:8px}.swatch{width:8px;height:8px;border-radius:50%}
.track{grid-column:1/3;height:5px;background:var(--track);border-radius:999px;overflow:hidden}.track span{display:block;height:100%;border-radius:999px}
.table-panel{margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--muted);font-weight:600;text-align:right;padding:11px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}td{padding:13px 10px;border-bottom:1px solid var(--tableline);text-align:right}tr:last-child td{border-bottom:0}.footer{font-size:11px;color:#71819c;text-align:right;padding:4px 2px 20px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:800px){.wrap{padding:24px 14px 40px}.header{align-items:flex-start}.header-actions{align-items:flex-start}}
@media(max-width:620px){.kpis{grid-template-columns:1fr}.donut-wrap{grid-template-columns:1fr}.chartbox{height:270px}h1{font-size:27px}}
@media(max-width:460px){.header{flex-direction:column}.header-actions{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div><div class="eyebrow">STOCK WEALTH</div><h1>주식 자산</h1><div class="sub">Excel 자산정리 데이터를 기반으로 만든 주식 자산 현황</div></div><div class="header-actions"><nav class="dashboard-nav" aria-label="대시보드 선택"><a href="family-dashboard.html">가족 자산</a><a class="active" href="stock.html">주식 자산</a></nav><button class="theme-toggle" id="themeToggle" type="button">☀️ 라이트 테마</button><div class="badge">최근 데이터 · <span id="stockBadge"></span></div></div></div>
  <section class="kpis">
    <div class="card"><div class="label">총 평가금액</div><div class="value" id="kpiTotal"></div></div>
    <div class="card"><div class="label">투자원금</div><div class="value" id="kpiPrincipal"></div></div>
    <div class="card"><div class="label">평가손익</div><div class="value pos" id="kpiProfit"></div></div>
    <div class="card"><div class="label">수익률</div><div class="value pos" id="kpiReturn"></div></div>
    <div class="card"><div class="label">전월 대비 자산</div><div class="value" id="kpiChange"></div></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>월별 총자산 추이</h2><div class="chartbox"><svg id="lineChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg></div><div class="legend"><span><i style="background:var(--blue)"></i>총 평가금액</span></div></div>
    <div class="panel"><h2 id="allocationTitle">계좌별 자산 구성</h2><div class="donut-wrap"><div class="donut" id="donut"><div class="donut-center">합계<b id="donutTotal"></b></div></div><div class="alloc" id="alloc"></div></div></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>월별 평가손익</h2><div class="chartbox"><svg id="barChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg></div></div>
    <div class="panel"><h2>수익률 흐름</h2><div class="chartbox"><svg id="returnChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg></div></div>
  </section>
  <section class="panel table-panel"><h2 id="accountTitle">계좌별 현황</h2><table><thead><tr><th>계좌</th><th>평가금액</th><th>원금</th><th>평가손익</th><th>수익률</th><th>비중</th></tr></thead><tbody id="accountTable"></tbody></table></section>
  <div class="footer">※ 월별 요약과 계좌별 현황은 각각 입력한 최신 자료 기준입니다.</div>
</div>
<script>
const root=document.documentElement;const themeToggle=document.getElementById('themeToggle');
function applyTheme(theme){root.classList.toggle('light',theme==='light');themeToggle.textContent=theme==='light'?'🌙 다크 테마':'☀️ 라이트 테마';localStorage.setItem('stockDashboardThemeV2',theme);}
const savedTheme=localStorage.getItem('stockDashboardThemeV2')||'dark';applyTheme(savedTheme);themeToggle.addEventListener('click',()=>applyTheme(root.classList.contains('light')?'dark':'light'));
// 새 월 자료를 추가할 때는 아래 monthlyData 맨 아래에 한 항목을 추가합니다.
const monthlyData=[
  {month:"2025-12",total:273455678,profit:56477839,returnPct:26.029},
  {month:"2026-01",total:329041754,profit:84270877,returnPct:34.428},
  {month:"2026-02",total:406731944,profit:97711962,returnPct:31.62},
  {month:"2026-03",total:411651586,profit:84841783,returnPct:25.961},
  {month:"2026-04",total:464492340,profit:105639460,returnPct:29.438},
  {month:"2026-05",total:521652184,profit:128908032,returnPct:32.822},
  {month:"2026-06",total:474872552,profit:105206866,returnPct:28.46},
  {month:"2026-07",total:378289806,profit:56592403,returnPct:17.592},
  {month:"2026-08",total:387482600,profit:60865710,returnPct:18.635},
  {month:"2026-09",total:412189654,profit:72896147,returnPct:21.0}
];
const months=monthlyData.map(x=>x.month),totals=monthlyData.map(x=>x.total),profits=monthlyData.map(x=>x.profit),returns=monthlyData.map(x=>x.returnPct);
const accountMonth="2026-09"; // 계좌별 자료를 갱신할 때 이 날짜와 아래 accounts도 함께 변경
const accounts=[{"name": "키움증권", "value": 15264210, "principal": 6500000, "profit": 8764210, "return": 1.34834}, {"name": "NH증권", "value": 65299887, "principal": 50000000, "profit": 15299887, "return": 0.30599774}, {"name": "한국투자증권", "value": 103527825, "principal": 100000000, "profit": 3527825, "return": 0.03527825}, {"name": "삼성증권(개인연금)", "value": 103750769, "principal": 66897360, "profit": 36853409, "return": 0.5508874602478723}, {"name": "S&P500", "value": 51450816, "principal": 43000000, "profit": 8450816, "return": 0.1965306046511628}];
const colors=['#7aa2ff','#59d29a','#f6c85f','#ff8a65','#b18cff','#5bd6e8'];
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const short=n=>n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(0)+'만':fmt(n);
const signedFmt=n=>(n<0?'-':'+')+fmt(Math.abs(n));
const latest=monthlyData.at(-1),previous=monthlyData.at(-2),principal=latest.total-latest.profit,monthChange=latest.total-previous.total,monthLabel=latest.month;
document.getElementById('stockBadge').textContent=monthLabel;document.getElementById('allocationTitle').textContent='계좌별 자산 구성 · '+accountMonth;document.getElementById('accountTitle').textContent='계좌별 현황 · '+accountMonth;
document.getElementById('kpiTotal').textContent=fmt(latest.total)+'원';document.getElementById('kpiPrincipal').textContent=fmt(principal)+'원';document.getElementById('kpiProfit').textContent=signedFmt(latest.profit)+'원';document.getElementById('kpiProfit').className='value '+(latest.profit>=0?'pos':'neg');document.getElementById('kpiReturn').textContent=(latest.returnPct>=0?'+':'')+latest.returnPct.toFixed(1)+'%';document.getElementById('kpiReturn').className='value '+(latest.returnPct>=0?'pos':'neg');document.getElementById('kpiChange').textContent=signedFmt(monthChange)+'원';document.getElementById('kpiChange').className='value '+(monthChange>=0?'pos':'neg');

function lineChart(svgId,data,suffix,stroke,fillArea){
  const svg=document.getElementById(svgId),W=760,H=300,L=58,R=16,T=18,B=38;
  const min=Math.min(...data),max=Math.max(...data),step=suffix==='%'?5:50000000,lo=suffix==='%'?Math.floor(min/step)*step:Math.max(0,Math.floor(min/step)*step),hi=Math.ceil(max/step)*step||step;
  const x=i=>L+i*(W-L-R)/(data.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='<defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+stroke+'" stop-opacity=".28"/><stop offset="100%" stop-color="'+stroke+'" stop-opacity=".02"/></linearGradient></defs>';
  for(let val=hi;val>=lo;val-=step){const yy=y(val),label=suffix==='%'?val.toFixed(0)+'%':(val/1e8).toFixed(1)+'억';s+='<line class="gridline" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="axis" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+label+'</text>';}
  const pts=data.map((v,i)=>[x(i),y(v)]);
  if(fillArea){const area='M '+pts[0][0]+' '+(H-B)+' '+pts.map(p=>'L '+p[0]+' '+p[1]).join(' ')+' L '+pts[pts.length-1][0]+' '+(H-B)+' Z';s+='<path d="'+area+'" fill="url(#areaGradient)"/>';}
  s+='<path d="M '+pts.map(p=>p.join(' ')).join(' L ')+'" fill="none" stroke="'+stroke+'" stroke-width="3"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--donut-hole)" stroke="'+stroke+'" stroke-width="2"/><text class="axis" x="'+p[0]+'" y="'+(H-14)+'" text-anchor="middle">'+months[i].slice(5)+'</text>';});
  svg.innerHTML=s;
}
function barChart(svgId,data){
  const svg=document.getElementById(svgId),W=760,H=300,L=58,R=16,T=18,B=38,min=Math.min(0,...data),max=Math.max(0,...data),step=25000000,lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step||step,xw=(W-L-R)/data.length,bw=xw*.58,y=v=>T+(hi-v)*(H-T-B)/(hi-lo||1),zero=y(0);let s='';
  const axisMoney=n=>{if(n===0)return'0';const sign=n<0?'-':'',v=Math.abs(n),hundred=Math.floor(v/1e8),man=Math.round((v-hundred*1e8)/1e4);return sign+(hundred?hundred+'억':'')+(man?(hundred?' ':'')+man.toLocaleString('ko-KR')+'만':'');};
  for(let val=hi;val>=lo;val-=step){const yy=y(val);s+='<line class="gridline" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="axis" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+axisMoney(val)+'</text>';}
  data.forEach((v,i)=>{const yy=y(v),xx=L+i*xw+(xw-bw)/2,top=Math.min(yy,zero),height=Math.max(1,Math.abs(zero-yy));s+='<rect x="'+xx+'" y="'+top+'" width="'+bw+'" height="'+height+'" rx="5" class="bar"/><text class="axis" x="'+(xx+bw/2)+'" y="'+(H-14)+'" text-anchor="middle">'+months[i].slice(5)+'</text>';});
  svg.innerHTML=s;
}
lineChart('lineChart',totals,'','#7aa2ff',true);barChart('barChart',profits);lineChart('returnChart',returns,'%','#59d29a',false);
const accTotal=accounts.reduce((a,b)=>a+b.value,0);document.getElementById('donutTotal').textContent=short(accTotal);
let cur=0,stops=[];accounts.forEach((a,i)=>{const p=a.value/accTotal*100,c=colors[i%colors.length];stops.push(c+' '+cur+'% '+(cur+p)+'%');cur+=p;});document.getElementById('donut').style.background='conic-gradient('+stops.join(',')+')';
const alloc=document.getElementById('alloc');accounts.forEach((a,i)=>{const p=a.value/accTotal*100,c=colors[i%colors.length];alloc.insertAdjacentHTML('beforeend','<div class="alloc-row"><div class="alloc-name"><span class="swatch" style="background:'+c+'"></span>'+a.name+'</div><div>'+p.toFixed(1)+'%</div><div class="track"><span style="width:'+p+'%;background:'+c+'"></span></div></div>');});
const tbody=document.getElementById('accountTable');accounts.forEach(a=>{const p=a.value/accTotal*100,cls=a.profit>=0?'pos':'neg';tbody.insertAdjacentHTML('beforeend','<tr><td>'+a.name+'</td><td>'+fmt(a.value)+'원</td><td>'+fmt(a.principal)+'원</td><td class="'+cls+'">'+(a.profit>=0?'+':'')+fmt(a.profit)+'원</td><td class="'+cls+'">'+(a.return>=0?'+':'')+(a.return*100).toFixed(1)+'%</td><td>'+p.toFixed(1)+'%</td></tr>');});
</script></body></html>
